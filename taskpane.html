<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header>
    <h1>Compare</h1>
    <button id="refresh-sheets" class="icon" title="Refresh sheet list" aria-label="Refresh sheet list">↻</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="colour" role="tab">ColourCode</button>
    <button class="tab" data-tab="pdf" role="tab">PDF finder</button>
  </nav>

  <main>
    <!-- ---------- ColourCode ---------- -->
    <div class="panel" id="tab-colour">
      <div id="cr-rules"></div>

      <button id="cr-add" class="link add">+ Add another colour rule</button>

      <label class="check cr-check">
        <input type="checkbox" id="cr-side-by-side" checked />
        <span>Cells of one colour side by side belong together</span>
      </label>

      <button id="cr-run" class="primary">Recon colours</button>
    </div>

    <!-- ---------- pdf finder ---------- -->
    <div class="panel hidden" id="tab-pdf">
      <label>Sheet
        <select id="pf-sheet"></select>
      </label>
      <label>Columns <span class="hint">optional &mdash; e.g. C, or A,B, or C:E</span>
        <input type="text" id="pf-cols" placeholder="every column" />
      </label>
      <label>Rows <span class="hint">optional &mdash; e.g. 12:250</span>
        <input type="text" id="pf-rows" placeholder="every row" />
      </label>

      <label class="check"><input type="checkbox" id="pf-follow" checked /> Show the cell I select on the PDF</label>

      <button id="pf-open" class="primary">Open PDF finder</button>
      <p id="pf-status" class="status"></p>
    </div>

    <!-- ---------- matching rules, used by ColourCode ---------- -->
    <section class="opts" id="opts">
      <label class="check"><input type="checkbox" id="ignore-sign" checked /> Ignore + / − (treat −100 as 100)</label>
      <label class="check"><input type="checkbox" id="ignore-case" checked /> Ignore case &amp; spacing on text</label>
      <details class="rules">
        <summary>More rules</summary>
        <label class="check"><input type="checkbox" id="round-whole" /> Ignore cents (round to whole numbers)</label>
        <label class="check"><input type="checkbox" id="ignore-punct" /> Ignore punctuation &amp; symbols in text</label>
        <label class="check"><input type="checkbox" id="ignore-zeros" /> Ignore leading zeros (00123 = 123)</label>
        <label class="num">Amount tolerance &plusmn;
          <input type="number" id="tolerance" min="0" step="0.01" value="0" />
        </label>
        <label class="num">Compare only the first N characters of text
          <input type="number" id="first-chars" min="0" step="1" value="0" placeholder="0 = all" />
        </label>
      </details>
      <button id="clear-colours" class="link">Clear colours</button>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script src="utils.js"></script>
  <script src="engine.js"></script>
  <script src="comparison.js"></script>
  <script src="sheets.js"></script>
  <script src="functions.js"></script>
  <script src="colourrecon.js"></script>
  <script src="pdffinder/debug.js"></script>
  <script src="pdffinder/wire.js"></script>
  <script src="taskpane.js"></script>
  <script src="pdffinder-pane.js"></script>
</body>
</html>
