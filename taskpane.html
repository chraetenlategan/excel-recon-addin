<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reconcile</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header>
    <h1>Reconcile</h1>
    <p class="sub">Amount + date matching, straight from your worksheets.</p>
  </header>

  <main>
    <section class="pick">
      <label>Cashbook <span class="req">required</span>
        <select id="sel-cashbook"></select>
      </label>
      <label>Bank statement <span class="opt">optional</span>
        <select id="sel-statement"></select>
      </label>
      <label>General ledger <span class="opt">optional</span>
        <select id="sel-ledger"></select>
      </label>
      <div class="row">
        <button id="load-detect" class="primary">Load &amp; detect columns</button>
        <button id="refresh-sheets" class="link">↻ Sheets</button>
      </div>
    </section>

    <section id="mapping-wrap" class="hidden">
      <div id="map-cashbook" class="mapcard hidden"></div>
      <div id="map-statement" class="mapcard hidden"></div>
      <div id="map-ledger" class="mapcard hidden"></div>

      <div class="opts">
        <label class="check"><input type="checkbox" id="global-desc-strict" /> Strict descriptions</label>
        <label class="check"><input type="checkbox" id="global-desc-ignore" /> Ignore descriptions</label>
      </div>

      <button id="reconcile" class="primary">Reconcile → write result sheets</button>
    </section>

    <p id="status" class="status"></p>
    <section id="summary" class="summary hidden"></section>
  </main>

  <footer>
    <a href="https://github.com/chraetenlategan/excel-recon-addin" target="_blank" rel="noopener">About / help</a>
  </footer>

  <script src="utils.js"></script>
  <script src="engine.js"></script>
  <script src="comparison.js"></script>
  <script src="sheets.js"></script>
  <script src="functions.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
