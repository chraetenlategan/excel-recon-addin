<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header>
    <h1>Compare columns</h1>
  </header>

  <main>
    <section class="side" id="side-a">
      <h3>Side A</h3>
      <label>Sheet
        <select data-k="sheet"></select>
      </label>
      <label>Column(s) <span class="hint">ctrl-click for several — a value counts as found if it's in any of them</span>
        <select data-k="column" multiple size="4"></select>
      </label>
      <label>Limit to range <span class="hint">optional — e.g. B12:B25, or 12:25, or F12:F25, H12:H25</span>
        <input type="text" data-k="limit" placeholder="whole column" />
      </label>
      <p class="range" data-k="preview"></p>
    </section>

    <section class="side" id="side-b">
      <h3>Side B</h3>
      <label>Sheet
        <select data-k="sheet"></select>
      </label>
      <label>Column(s) <span class="hint">ctrl-click for several — a value counts as found if it's in any of them</span>
        <select data-k="column" multiple size="4"></select>
      </label>
      <label>Limit to range <span class="hint">optional — e.g. B12:B25, or 12:25, or F12:F25, H12:H25</span>
        <input type="text" data-k="limit" placeholder="whole column" />
      </label>
      <p class="range" data-k="preview"></p>
    </section>

    <section class="opts">
      <label class="check"><input type="checkbox" id="ignore-sign" checked /> Ignore + / − (treat −100 as 100)</label>
      <label class="check"><input type="checkbox" id="ignore-case" checked /> Ignore case &amp; spacing on text</label>
      <div class="row">
        <button id="compare" class="primary">Compare</button>
        <button id="refresh-sheets" class="icon" title="Refresh sheet list" aria-label="Refresh sheet list">↻</button>
      </div>
      <button id="clear-colours" class="link">Clear colours</button>
    </section>

    <p id="status" class="status"></p>
  </main>

  <footer>
    <a href="https://github.com/chraetenlategan/excel-recon-addin" target="_blank" rel="noopener">Help</a>
  </footer>

  <script src="utils.js"></script>
  <script src="engine.js"></script>
  <script src="comparison.js"></script>
  <script src="sheets.js"></script>
  <script src="functions.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
