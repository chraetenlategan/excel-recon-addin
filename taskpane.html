<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header>
    <h1>Compare</h1>
    <button id="refresh-sheets" class="icon" title="Refresh sheet list" aria-label="Refresh sheet list">↻</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="colour" role="tab">Colour recon</button>
    <button class="tab" data-tab="columns" role="tab">Columns</button>
    <button class="tab" data-tab="pdf" role="tab">PDF finder</button>
  </nav>

  <main>
    <!-- ---------- colour recon ---------- -->
    <div class="panel" id="tab-colour">
      <p class="hint block">Colour the cells you want checked, then add one rule per colour. Matched cells go green, unmatched go red.</p>

      <div id="cr-rules"></div>

      <button id="cr-add" class="link add">+ Add another colour rule</button>

      <label class="check cr-check">
        <input type="checkbox" id="cr-side-by-side" checked />
        <span>Cells of one colour side by side belong together</span>
      </label>

      <button id="cr-run" class="primary">Recon colours</button>
    </div>

    <!-- ---------- column compare ---------- -->
    <div class="panel hidden" id="tab-columns">
      <section class="side" id="side-a">
        <h3>Side A</h3>
        <label>Sheet
          <select data-k="sheet"></select>
        </label>
        <label>Column(s) <span class="hint">ctrl-click for several — a value counts as found if it's in any of them</span>
          <select data-k="column" multiple size="4"></select>
        </label>
        <label>Limit to range <span class="hint">optional — e.g. B12:B25, or 12:25, or F12:F25, H12:H25</span>
          <input type="text" data-k="limit" placeholder="whole column" />
        </label>
        <button class="use-sel" data-k="use-selection">Use selected cells</button>
        <p class="range" data-k="preview"></p>
      </section>

      <section class="side" id="side-b">
        <h3>Side B</h3>
        <label>Sheet
          <select data-k="sheet"></select>
        </label>
        <label>Column(s) <span class="hint">ctrl-click for several — a value counts as found if it's in any of them</span>
          <select data-k="column" multiple size="4"></select>
        </label>
        <label>Limit to range <span class="hint">optional — e.g. B12:B25, or 12:25, or F12:F25, H12:H25</span>
          <input type="text" data-k="limit" placeholder="whole column" />
        </label>
        <button class="use-sel" data-k="use-selection">Use selected cells</button>
        <p class="range" data-k="preview"></p>
      </section>

      <button id="compare" class="primary">Compare</button>
    </div>


    <!-- ---------- pdf finder ---------- -->
    <div class="panel hidden" id="tab-pdf">
      <label>Sheet
        <select id="pf-sheet"></select>
      </label>
      <label>Columns <span class="hint">optional &mdash; e.g. C, or A,B, or C:E</span>
        <input type="text" id="pf-cols" placeholder="every column" />
      </label>
      <label>Rows <span class="hint">optional &mdash; e.g. 12:250</span>
        <input type="text" id="pf-rows" placeholder="every row" />
      </label>

      <label class="check"><input type="checkbox" id="pf-follow" checked /> Show the cell I select on the PDF</label>

      <button id="pf-open" class="primary">Open PDF finder</button>
      <p id="pf-status" class="status"></p>

      <details class="dbg" id="pf-dbg">
        <summary>Bridge diagnostics</summary>
        <p class="hint">Open the finder, press <b>Test bridge</b>, then copy the report.</p>
        <div class="dbg-tools">
          <button id="pf-dbg-test">Test bridge</button>
          <button id="pf-dbg-raw" title="Send one plain string with no codec around it">Raw echo</button>
          <button id="pf-dbg-pull" title="Ask the finder window for its own log">Fetch window log</button>
          <button id="pf-dbg-copy">Copy report</button>
          <button id="pf-dbg-clear">Clear</button>
        </div>
        <textarea id="pf-dbg-log" readonly spellcheck="false"></textarea>
      </details>
    </div>

    <!-- ---------- matching rules, shared by the two compare tabs ---------- -->
    <section class="opts" id="opts">
      <label class="check"><input type="checkbox" id="ignore-sign" checked /> Ignore + / − (treat −100 as 100)</label>
      <label class="check"><input type="checkbox" id="ignore-case" checked /> Ignore case &amp; spacing on text</label>
      <details class="rules">
        <summary>More rules</summary>
        <label class="check"><input type="checkbox" id="round-whole" /> Ignore cents (round to whole numbers)</label>
        <label class="check"><input type="checkbox" id="ignore-punct" /> Ignore punctuation &amp; symbols in text</label>
        <label class="check"><input type="checkbox" id="ignore-zeros" /> Ignore leading zeros (00123 = 123)</label>
        <label class="num">Amount tolerance &plusmn;
          <input type="number" id="tolerance" min="0" step="0.01" value="0" />
        </label>
        <label class="num">Compare only the first N characters of text
          <input type="number" id="first-chars" min="0" step="1" value="0" placeholder="0 = all" />
        </label>
      </details>
      <button id="clear-colours" class="link">Clear colours</button>
    </section>

    <p id="status" class="status"></p>
  </main>

  <footer>
    <a href="https://github.com/chraetenlategan/excel-recon-addin" target="_blank" rel="noopener">Help</a>
  </footer>

  <script src="utils.js"></script>
  <script src="engine.js"></script>
  <script src="comparison.js"></script>
  <script src="sheets.js"></script>
  <script src="functions.js"></script>
  <script src="colourrecon.js"></script>
  <script src="pdffinder/debug.js"></script>
  <script src="pdffinder/wire.js"></script>
  <script src="taskpane.js"></script>
  <script src="pdffinder-pane.js"></script>
</body>
</html>
