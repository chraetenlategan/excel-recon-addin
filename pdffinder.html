<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF finder</title>
<link rel="icon" href="assets/icon-32.png">
<link rel="stylesheet" href="pdffinder.css">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="pdffinder/wire.js"></script>
</head>
<body>

<header class="chrome">
  <img class="logo" src="assets/logo.jpg" alt="">
  <h1>PDF finder
    <small id="scope">the cells from Excel, found on the page</small>
  </h1>

  <div class="tally" title="Cells ticked off, out of the cells in scope">
    <span id="tHit">0</span>/<span id="tAll">0</span>
  </div>

  <div class="tools">
    <label class="chk" title="Match whole values only"><input type="checkbox" id="optExact"><span>Exact</span></label>
    <label class="chk" title="Ticking a value off moves the Excel cursor to its cell"><input type="checkbox" id="optFollow" checked><span>Follow</span></label>
    <button id="btnTick" class="mini dot" title="Tick colour"></button>
  </div>

  <div class="actions">
    <button id="btnOpen" class="primary">Open PDF</button>
    <button id="btnPull" title="Read the cells in scope again">Re-read cells</button>
    <button id="btnClear" title="Release every tick" disabled>Clear ticks</button>
    <input type="file" id="filePdf" accept="application/pdf" hidden>
  </div>

  <div class="picker" id="tickPick" hidden>
    <button class="sw" data-c="#FFE94D" title="Yellow"></button>
    <button class="sw" data-c="#A6F06B" title="Green"></button>
    <button class="sw" data-c="#6FD7FF" title="Blue"></button>
    <button class="sw" data-c="#FF9ED2" title="Pink"></button>
    <button class="sw" data-c="#FFB05C" title="Orange"></button>
    <label class="sw any" title="Any colour"><input type="color" id="tickAny" value="#FFE94D"></label>
  </div>
</header>

<main class="viewer" id="viewer"
      title="Click a value on the page to tick it off &middot; double-click any value to put the Excel cursor on it &middot; right-click to release">
  <div class="drop" id="drop">
    <div class="dropInner">
      <div class="seal"></div>
      <p>Drop a PDF here</p>
    </div>
  </div>
  <div class="pages" id="pages"></div>
  <div class="toast" id="toast" hidden></div>
</main>

<div class="bar" id="bar" hidden><i id="barFill"></i></div>

<script type="module" src="pdffinder/finder.js"></script>
</body>
</html>
